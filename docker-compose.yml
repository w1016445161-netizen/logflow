
services:
  mysql:
    image: mysql:8.0
    container_name: logflow-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logflow
      MYSQL_USER: logflow
      MYSQL_PASSWORD: logflow123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7
    container_name: logflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
